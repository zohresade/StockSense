<script>
// ── Minimal inline Supabase client (REST + Auth) ──────────────────────────
(function(){
  function createClient(url,key){
    const h={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'};
    let _session=null,_listeners=[];

    // ── Storage helpers ──────────────────────────────────────────────────
    const SK='sb-'+url.split('.')[0].split('//')[1]+'-auth-token';
    function saveSession(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}
    function loadSession(){try{return JSON.parse(localStorage.getItem(SK)||'null');}catch(e){return null;}}
    function clearSession(){try{localStorage.removeItem(SK);}catch(e){}}

    // ── Emit auth event ──────────────────────────────────────────────────
    function emit(event,session){_listeners.forEach(fn=>{try{fn(event,session);}catch(e){}});}

    // ── REST query builder ───────────────────────────────────────────────
    function from(table){
      let _url=url+'/rest/v1/'+table;
      let _method='GET',_body=null,_headers={...h},_params=new URLSearchParams();
      if(_session?.access_token)_headers['Authorization']='Bearer '+_session.access_token;

      function applySelect(cols){_params.set('select',cols||'*');return q;}
      function q(){}
      q.select=function(cols='*'){applySelect(cols);return q;};
      q.insert=function(data){_method='POST';_body=JSON.stringify(data);_headers['Prefer']='return=representation';_params.set('select','*');return q;};
      q.update=function(data){_method='PATCH';_body=JSON.stringify(data);_headers['Prefer']='return=representation';_params.set('select','*');return q;};
      q.upsert=function(data,opts){
        _method='POST';_body=JSON.stringify(data);
        _headers['Prefer']='resolution=merge-duplicates,return=representation';
        if(opts?.onConflict)_params.set('on_conflict',opts.onConflict);
        _params.set('select','*');return q;
      };
      q.delete=function(){_method='DELETE';_headers['Prefer']='return=minimal';return q;};
      q.eq=function(col,val){_params.append(col,'eq.'+val);return q;};
      q.neq=function(col,val){_params.append(col,'neq.'+val);return q;};
      q.in=function(col,vals){_params.append(col,'in.('+vals.join(',')+')');return q;};
      q.order=function(col,opts){_params.append('order',col+(opts?.ascending===false?'.desc':'.asc'));return q;};
      q.limit=function(n){_params.set('limit',n);return q;};
      q.single=function(){_headers['Accept']='application/vnd.pgrst.object+json';return q;};
      q.then=async function(resolve,reject){
        try{
          const qs=_params.toString();
          const fullUrl=_url+(qs?'?'+qs:'');
          if(_session?.access_token)_headers['Authorization']='Bearer '+_session.access_token;
          if(_method==='GET'||_method==='DELETE')_body=undefined;
          const r=await fetch(fullUrl,{method:_method,headers:_headers,body:_body});
          const text=await r.text();
          let data=null,error=null;
          try{data=text?JSON.parse(text):null;}catch(e){data=text;}
          if(!r.ok)error={message:(data?.message||data?.hint||data?.details||text||r.statusText),code:r.status};
          resolve({data,error});
        }catch(e){resolve({data:null,error:{message:e.message}});}
      };
      q.catch=function(fn){return Promise.resolve(q).catch(fn);};
      return q;
    }

    // ── Auth ─────────────────────────────────────────────────────────────
    const auth={
      async signInWithPassword({email,password}){
        try{
          const r=await fetch(url+'/auth/v1/token?grant_type=password',{
            method:'POST',headers:h,body:JSON.stringify({email,password})});
          const d=await r.json();
          if(!r.ok)return{data:null,error:{message:d.error_description||d.msg||d.message||'Fel vid inloggning'}};
          _session={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};
          saveSession(_session);emit('SIGNED_IN',_session);
          return{data:{session:_session,user:d.user},error:null};
        }catch(e){return{data:null,error:{message:e.message}};}
      },
      async signUp({email,password,options}){
        try{
          const r=await fetch(url+'/auth/v1/signup',{
            method:'POST',headers:h,
            body:JSON.stringify({email,password,data:options?.data||{}})});
          const d=await r.json();
          if(!r.ok)return{data:null,error:{message:d.error_description||d.msg||d.message||'Fel vid registrering'}};
          if(d.access_token){
            _session={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};
            saveSession(_session);emit('SIGNED_IN',_session);
          }
          return{data:{user:d.user||d,session:_session},error:null};
        }catch(e){return{data:null,error:{message:e.message}};}
      },
      async signOut(){
        try{
          if(_session?.access_token)
            await fetch(url+'/auth/v1/logout',{method:'POST',headers:{...h,'Authorization':'Bearer '+_session.access_token}});
        }catch(e){}
        _session=null;clearSession();emit('SIGNED_OUT',null);
        return{error:null};
      },
      async getSession(){return{data:{session:_session},error:null};},
      async getUser(){
        if(!_session)return{data:{user:null},error:null};
        return{data:{user:_session.user},error:null};
      },
      async resetPasswordForEmail(email){
        try{
          await fetch(url+'/auth/v1/recover',{method:'POST',headers:h,body:JSON.stringify({email})});
        }catch(e){}
        return{error:null};
      },
      onAuthStateChange(fn){
        _listeners.push(fn);
        // Restore session from storage
        const stored=loadSession();
        if(stored){_session=stored;setTimeout(()=>fn('SIGNED_IN',stored),0);}
        else{setTimeout(()=>fn('SIGNED_OUT',null),0);}
        return{data:{subscription:{unsubscribe:()=>{_listeners=_listeners.filter(f=>f!==fn);}}}};
      }
    };
    return{from,auth};
  }
  window.supabase={createClient};
  // Signal ready immediately — no CDN to wait for
  window._supaReady=true;
  (window._supaQueue||[]).forEach(fn=>fn());
  window._supaQueue=[];
})();
function onSupa(fn){fn();}
</script>
<style>
:root{
  --bg:#07070f;--surface:#0e0e1c;--card:#131325;--border:#1c1c30;--border2:#252540;
  --text:#ddd8cc;--muted:#6a6a86;--ghost:#252538;--faint:#1a1a2e;
  --amber:#d4943a;--amber2:#b87d2e;--green:#3fa86a;--red:#b84444;--blue:#4a7ec8;
  color-scheme:dark;--font:'Inter',system-ui,sans-serif;--sidebar-w:230px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}[hidden]{display:none!important}

/* LAYOUT */
#shell{display:flex;height:100vh;height:100dvh}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .22s ease}
#sidebar.collapsed{width:0;border-right:none}
.sb-top{padding:18px 14px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sb-logo-icon{font-size:20px}
.sb-logo-name{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--amber);white-space:nowrap}
.sb-venue{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1px}
.sb-section{padding:10px 8px 4px;flex-shrink:0}
.sb-section-label{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);padding:0 6px;margin-bottom:4px;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .12s;color:var(--text);white-space:nowrap;overflow:hidden}
.sb-item:hover{background:var(--ghost)}.sb-item.active{background:rgba(212,148,58,.12);color:var(--amber)}
.sb-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-item .label{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;flex:1}
.sb-item .badge{font-size:9px;font-weight:700;background:var(--ghost);color:var(--muted);padding:2px 5px;border-radius:10px;flex-shrink:0}
.sb-item.active .badge{background:rgba(212,148,58,.2);color:var(--amber)}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.sb-add-btn{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;border:1px dashed var(--border2);background:none;width:100%;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.05em;transition:border-color .15s,color .15s;margin:4px 0 0}
.sb-add-btn:hover{border-color:var(--amber);color:var(--amber)}
.sb-bottom{padding:8px;border-top:1px solid var(--border);flex-shrink:0}
.sb-bottom-btn{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--muted);font-size:12px;transition:color .12s,background .12s}
.sb-bottom-btn:hover{color:var(--text);background:var(--ghost)}
.sb-bottom-btn .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtCl(cl){return cl===0?"0 cl":cl%1===0?`${cl} cl`:`${cl.toFixed(1)} cl`;}
function fmtKr(kr){return kr>=1000?`${(kr/1000).toFixed(1)}k kr`:`${Math.round(kr)} kr`;}
function flash(msg="✓ Klart!",col="var(--green)"){
  const el=document.getElementById("flash");
  el.textContent=msg;el.style.background=col;el.classList.add("show");

}
function barById(id){return bars.find(b=>b.id===id);}
function prodById(id){return products.find(p=>p.id===id);}
function cats(){return[...new Set(products.map(p=>p.cat))];}
function barTotals(bid){
  const items=inventory[bid]||{};let cl=0,fl=0,kr=0,units=0;
  products.forEach(p=>{
    const e=items[p.id];if(!e)return;
    if(p.mode==="spirit"){const tcl=(e.hela||0)*p.size_cl+(e.cl||0);const f=p.size_cl>0?tcl/p.size_cl:0;cl+=tcl;fl+=f;kr+=f*(p.price||0);}
    else{units+=e.antal||0;}
  });
  return{cl,fl,kr,units};
}
function grandTotals(){let cl=0,fl=0,kr=0,units=0;bars.forEach(b=>{const t=barTotals(b.id);cl+=t.cl;fl+=t.fl;kr+=t.kr;units+=t.units;});return{cl,fl,kr,units};}
function countItems(bid){const items=inventory[bid]||{};return products.filter(p=>{const e=items[p.id];return e&&(e.hela||0)+(e.cl||0)+(e.antal||0)>0;}).length;}

function showAuthTab(tab){

function showAuthErr(msg){const el=document.getElementById("auth-err");el.textContent=msg;el.hidden=false;document.getElementById("auth-ok").hidden=true;}

async function doLogin(){
  const email=document.getElementById("login-email").value.trim();
  const pass=document.getElementById("login-pass").value;
  if(!email||!pass){showAuthErr("Fyll i e-post och lösenord.");return;}
  showAuthErr("Loggar in…");
  try{
    const {error}=await sb().auth.signInWithPassword({email,password:pass});
    if(error)showAuthErr("Fel: "+error.message);
    else hideAuthMsg();
  }catch(e){showAuthErr("Fel: "+e.message);}
}
async function doRegister(){
  const name=document.getElementById("reg-name").value.trim();
  const email=document.getElementById("reg-email").value.trim();
  const pass=document.getElementById("reg-pass").value;
  const token=document.getElementById("reg-token").value.trim()||pendingInviteToken;
  if(!name||!email||!pass){showAuthErr("Fyll i alla fält.");return;}
  if(pass.length<6){showAuthErr("Lösenordet måste vara minst 6 tecken.");return;}
  showAuthErr("Skapar konto…");
  const meta={full_name:name,role:token?"staff":"admin"};
  try{
    const {error}=await sb().auth.signUp({email,password:pass,options:{data:meta}});
    if(error){showAuthErr("Fel: "+error.message);return;}
  }catch(e){showAuthErr("Nätverksfel: "+e.message);return;}
  if(token){
    // Accept invitation after registration
    pendingInviteToken=token;
    showAuthOk("Konto skapat! Logga in för att slutföra inbjudan.");
    showAuthTab("login");
  }else{
    showAuthOk("Konto skapat! Bekräfta din e-post och logga sedan in.");
    showAuthTab("login");
  }
}

async function checkInviteToken(token){
  const {data,error}=await sb().from("invitations").select("*").eq("token",token).eq("accepted",false).single();
  if(error||!data){
    document.getElementById("invite-sub").textContent="Inbjudan är ogiltig eller redan använd.";
    document.getElementById("invite-form").hidden=true;
    return;
  }
  document.getElementById("invite-sub").textContent=`Du är inbjuden som ${data.role} till Spy Bar Stockholm`;
  pendingInviteToken=token;
  document.getElementById("invite-screen").hidden=false;
  document.getElementById("auth-screen").hidden=true;
}
async function acceptInvite(){
  if(!pendingInviteToken)return;
  const name=document.getElementById("inv-name").value.trim();
  const pass=document.getElementById("inv-pass").value;
  if(!name||!pass){document.getElementById("invite-err").textContent="Fyll i namn och lösenord.";document.getElementById("invite-err").hidden=false;return;}
  // Get invite
  const {data:inv}=await sb().from("invitations").select("*").eq("token",pendingInviteToken).single();
  if(!inv)return;
  // Register
  const {data:authData,error}=await sb().auth.signUp({email:inv.email,password:pass,options:{data:{full_name:name,role:inv.role}}});
  if(error){document.getElementById("invite-err").textContent=error.message;document.getElementById("invite-err").hidden=false;return;}
  // Mark accepted + set venue
  await sb().from("invitations").update({accepted:true}).eq("token",pendingInviteToken);
  if(authData.user){
    await sb().from("profiles").update({venue_id:inv.venue_id,role:inv.role,full_name:name}).eq("id",authData.user.id);
  }
  document.getElementById("invite-screen").hidden=true;
  document.getElementById("auth-screen").hidden=false;
  showAuthOk("Konto skapat! Logga in nu.");
  showAuthTab("login");
}

/* ═══ LOAD DATA ═══ */
async function loadData(){
  // Profile
  const {data:profile,error:pErr}=await sb().from("profiles").select("*").eq("id",(await sb().auth.getUser()).data.user.id).single();
  if(pErr||!profile)throw new Error("Profil: "+(pErr?(pErr.message||JSON.stringify(pErr)):"hittades inte"));
  me=profile;
  // Venue
  if(me.role==="admin"){
    // Admin: list all venues, use first (or create)
    const {data:vens,error:vsErr}=await sb().from("venues").select("*").order("created_at");
    if(vsErr)throw new Error("Venues: "+(vsErr.message||JSON.stringify(vsErr)));
    if(Array.isArray(vens)&&vens.length>0)venue=vens[0];
    else{
      const {data:nv,error:vErr}=await sb().from("venues").insert({name:"Spy Bar Stockholm"}).select().single();
      if(vErr||!nv)throw new Error("Venue: "+(vErr?vErr.message:"kunde inte skapas"));
      venue=nv;
      await sb().from("profiles").update({venue_id:nv.id}).eq("id",me.id);
    }
  }else{
    const {data:ven}=await sb().from("venues").select("*").eq("id",me.venue_id).single();
    venue=ven;
  }
  if(!venue)return;
  // Bars
  const {data:barsData,error:bErr}=await sb().from("bars").select("*").eq("venue_id",venue.id).order("sort_order");
  if(bErr)throw new Error("Barer: "+(bErr.message||JSON.stringify(bErr)));
  bars=Array.isArray(barsData)?barsData:[];
  // Seed bars if empty (admin only)
  if(bars.length===0&&me.role==="admin"){
    const toInsert=DEFAULT_BARS.map(b=>({...b,venue_id:venue.id}));
    const {data:seeded,error:sErr}=await sb().from("bars").insert(toInsert).select();
    if(sErr)throw new Error("Barer: "+sErr.message);
    bars=(seeded||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  }
  // Products
  const {data:prodsData,error:prErr}=await sb().from("products").select("*").eq("venue_id",venue.id).order("cat").order("name");
  if(prErr)throw new Error("Produkter: "+(prErr.message||JSON.stringify(prErr)));
  products=Array.isArray(prodsData)?prodsData:[];
  // Seed products if empty (admin only)
  if(products.length===0&&me.role==="admin"){
    const toInsert=DEFAULT_PRODUCTS.map(p=>({unit:"st",...p,venue_id:venue.id}));
    const {data:seeded,error:sErr}=await sb().from("products").insert(toInsert).select();
    if(sErr)throw new Error("Produkter: "+sErr.message);
    products=seeded||[];
  }
  // Inventory
  await loadInventory();
}

async function loadInventory(){
  const barIds=bars.map(b=>b.id);
  if(!barIds.length)return;
  const {data:invData}=await sb().from("inventory").select("*").in("bar_id",barIds);
  inventory={};
  (invData||[]).forEach(row=>{
    if(!inventory[row.bar_id])inventory[row.bar_id]={};
    inventory[row.bar_id][row.product_id]={hela:row.hela||0,cl:row.cl||0,antal:row.antal||0};
  });
}

async function boot(user){
  document.getElementById("auth-screen").hidden=true;
  document.getElementById("invite-screen").hidden=true;
  document.getElementById("page").innerHTML=`<div class="loading"><div class="loading-spin"></div><div style="color:var(--muted);font-size:12px">Laddar data…</div></div>`;
  document.getElementById("shell").hidden=false;
  try{await loadData();}catch(e){
    document.getElementById("page").innerHTML=`<div style="padding:24px;color:#e07070;font-size:13px;line-height:1.6"><b>Kunde inte ladda data</b><br>${esc(e.message||String(e))}<br><br><button class="btn-ghost btn-sm" onclick="sb().auth.signOut().then(()=>location.reload())">Logga ut</button></div>`;
    return;
  }
  // Update pending invite
  if(pendingInviteToken){
    const {data:inv}=await sb().from("invitations").select("*").eq("token",pendingInviteToken).eq("accepted",false).single();
    if(inv){
      await sb().from("invitations").update({accepted:true}).eq("token",pendingInviteToken);
      await sb().from("profiles").update({venue_id:inv.venue_id,role:inv.role}).eq("id",user.id);
      await loadData();
    }
    pendingInviteToken=null;
  }
  renderUser();
  if(bars.length>0)navTo(bars[0].id);
  else navTo("settings");
}

  const b=barById(barId);if(!b)return;

  setTopbar(
    `${b.emoji||""} ${b.name}`,
    `<span style="color:${col}">${t.fl.toFixed(1)} fl · ${fmtCl(t.cl)} · ${fmtKr(t.kr)}</span>`,
    isManager()?`<button class="btn-icon" onclick="showEditBar('${barId}')" title="Redigera bar">✏️</button>`:""
  );

    ${buildScanPanel(barId,col)}

function buildScanPanel(barId,col){
  return `<div class="scan-panel" style="border-color:${col}33">
    <div class="scan-label" style="color:${col}">Registrera produkt</div>
    <div class="scan-row">
      <input id="scan-inp" class="scan-inp" placeholder="Sök produktnamn…"
        oninput="onScanInput(event)" onkeydown="if(event.key==='Enter')doTextScan()">
      <button class="cam-btn" onclick="openCamera('${barId}')" title="Skanna med kamera">📷</button>
      <button class="btn btn-amber btn-sm" onclick="doTextScan()" style="flex-shrink:0">Sök</button>
    </div>
    <div id="scan-dd" hidden class="dropdown"></div>
    <div id="scan-result" hidden></div>
  </div>`;

function buildInvList(barId,col){

      (items[p.id].hela||0)+(items[p.id].cl||0)+(items[p.id].antal||0)>0);
    if(!prods.length)return;
    html+=`<div>
      <div class="inv-sec-hdr" style="color:${col}">${esc(cat)}</div>
      <div style="background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;overflow:hidden">

        html+=`<tr>

          <td style="color:${col};font-weight:600">${e.hela||0} hela${e.cl?` + ${e.cl}cl`:""}</td>

      }else{

          <td style="color:${col};font-weight:600">${e.antal||0} ${esc(p.unit||"st")}</td>

/* ═══ SCAN ═══ */
function onScanInput(e){
  const q=e.target.value.trim();const dd=document.getElementById("scan-dd");
  if(!q){dd.hidden=true;return;}
  const ms=products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  if(!ms.length){dd.hidden=true;return;}
  dd.hidden=false;
  dd.innerHTML=ms.map(p=>`<div class="dd-row" onclick="selectProduct('${p.id}')">
    <div><div class="dd-name">${esc(p.name)}</div><div class="dd-meta">${esc(p.cat)}${p.mode==="spirit"?` · ${p.size_cl}cl`:""}</div></div>
    <div style="font-size:10px;color:var(--muted)">${p.price||0} kr</div>
  </div>`).join("");
}
function selectProduct(id){
  const p=prodById(id);if(!p)return;
  document.getElementById("scan-dd").hidden=true;
  document.getElementById("scan-inp").value=p.name;
  showResultCard(p,100,85);
}
function localSearch(q){
  const lq=q.toLowerCase().trim();if(!lq)return null;
  let m=products.find(p=>p.name.toLowerCase()===lq);if(m)return{product:m,confidence:100};
  m=products.find(p=>p.name.toLowerCase().includes(lq));if(m)return{product:m,confidence:90};
  const words=lq.split(/\s+/).filter(w=>w.length>1);
  m=products.find(p=>words.every(w=>p.name.toLowerCase().includes(w)));if(m)return{product:m,confidence:80};
  const scored=products.map(p=>({product:p,hits:words.filter(w=>p.name.toLowerCase().includes(w)).length}))
    .filter(x=>x.hits>0).sort((a,b)=>b.hits-a.hits);
  return scored.length?{product:scored[0].product,confidence:60}:null;
}
async function doTextScan(){
  const q=document.getElementById("scan-inp")?.value?.trim();if(!q)return;
  document.getElementById("scan-dd").hidden=true;
  const local=localSearch(q);
  if(local&&local.confidence>=88){showResultCard(local.product,local.confidence,85);return;}
  if(!apiKey){openModal("modal-api");return;}
  setResultHtml(`<div style="color:var(--muted);padding:12px;font-size:13px">🔍 Söker…</div>`);
  try{
    const ai=await aiText(q);
    if(ai.matched_name){const p=products.find(x=>x.name===ai.matched_name);if(p){showResultCard(p,ai.confidence,85);return;}}
    if(local){showResultCard(local.product,local.confidence,85);return;}
    setResultHtml(`<div style="color:var(--red);padding:12px">Ingen matchning.</div>`);
  }catch{
    if(local){showResultCard(local.product,local.confidence,85);return;}
    setResultHtml(`<div style="color:var(--red);padding:12px">Nätverksfel.</div>`);
  }
}
function setResultHtml(html){const el=document.getElementById("scan-result");el.innerHTML=html;el.hidden=false;}

        <div class="qty-row">

      </div>`;
  }

        <div class="result-name">${esc(prod.name)}</div>

      </div>

      </div>

}
function adjHela(d){window._cp.hela=Math.max(0,(window._cp.hela||0)+d);document.getElementById("hela-num").textContent=window._cp.hela;}
function adjQty(d){window._cp.qty=Math.max(1,(window._cp.qty||1)+d);document.getElementById("qty-num").textContent=window._cp.qty;}
function setQty(n){window._cp.qty=n;document.getElementById("qty-num").textContent=n;}
function updateFillSlider(){
  const pct=parseInt(document.getElementById("fill-slider").value);
  const cl=Math.round((pct/100)*(window._cp.size||70)*10)/10;
  window._cp.cl=cl;window._cp.fillPct=pct;
  document.getElementById("cl-inp").value=cl;
  document.getElementById("fill-pct").textContent=pct+"%";
}

/* ═══ ADD / REMOVE (Supabase) ═══ */
async function addItem(prodId){
  const p=prodById(prodId);if(!p||!currentView)return;
  const barId=currentView;
  if(!inventory[barId])inventory[barId]={};
  const cur=inventory[barId][p.id]||{hela:0,cl:0,antal:0};
  const cp=window._cp||{};
  let newRow;
  if(p.mode==="spirit"){
    const clVal=parseFloat(document.getElementById("cl-inp")?.value)||cp.cl||0;
    newRow={bar_id:barId,product_id:p.id,hela:(cur.hela||0)+(cp.hela||0),cl:+(((cur.cl||0)+clVal).toFixed(1)),antal:0,updated_by:me.id};
  }else{
    newRow={bar_id:barId,product_id:p.id,hela:0,cl:0,antal:(cur.antal||0)+(cp.qty||1),updated_by:me.id};
  }
  const {error}=await sb().from("inventory").upsert(newRow,{onConflict:"bar_id,product_id"});
  if(error){flash("Fel: "+error.message,"var(--red)");return;}
  inventory[barId][p.id]={hela:newRow.hela,cl:newRow.cl,antal:newRow.antal};
  flash("✓ "+p.name);
  document.getElementById("scan-inp").value="";
  document.getElementById("scan-result").hidden=true;
  window._cp={};
  const b=barById(barId);const col=b?.color||"var(--amber)";
  const t=barTotals(barId);
  document.getElementById("topbar-meta").innerHTML=`<span style="color:${col}">${t.fl.toFixed(1)} fl · ${fmtCl(t.cl)} · ${fmtKr(t.kr)}</span>`;
  document.getElementById("inv-list").innerHTML=buildInvList(barId,col);
  renderSidebar();
}
async function removeItem(barId,prodId){
  await sb().from("inventory").delete().eq("bar_id",barId).eq("product_id",prodId);
  if(inventory[barId])delete inventory[barId][prodId];
  flash("Borttagen","var(--red)");renderBar(barId);renderSidebar();
}

/* ═══ AI ═══ */
async function aiCall(payload){
  const {data:{session}}=await sb().auth.getSession();
  if(!session)throw new Error("Inte inloggad");
  const r=await fetch(SUPA_URL+"/functions/v1/ai-scen",{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+session.access_token},
    body:JSON.stringify(payload)
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.error)throw new Error((d.error&&d.error.message)||d.error||d.message||("HTTP "+r.status));
  return d;
}
async function aiImage(b64,mime){
  return aiCall({kind:"image",b64,mime,names:products.map(p=>p.name),sizes:Object.fromEntries(products.map(p=>[p.name,p.mode==="spirit"?p.size_cl:0]))});
}
async function aiText(text){
  return aiCall({kind:"text",text,names:products.map(p=>p.name)});
}

/* ═══ CAMERA ═══ */
function openCamera(barId){
  camState={phase:"pick",imgB64:null,mime:"image/jpeg",result:null,pendingBar:barId||currentView};
  document.getElementById("cam-overlay").hidden=false;renderCam();
}
function closeCamera(){document.getElementById("cam-overlay").hidden=true;}
function renderCam(){
  const el=document.getElementById("cam-body");
  document.querySelectorAll(".cam-controls").forEach(n=>n.remove());
  if(camState.phase==="pick"){
    el.innerHTML=`
      <div style="font-size:52px">📸</div>
      <div style="font-size:16px;font-weight:700">Ta ett foto av flaskan</div>
      <div style="font-size:13px;color:var(--muted);text-align:center;max-width:280px;line-height:1.7">På mobil öppnas kameran direkt.<br>AI identifierar produkt och fyllnadsgrad.</div>
      <div style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px">
        <label class="btn btn-amber" style="display:block;text-align:center;padding:13px;cursor:pointer">
          📷 Öppna kamera
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handleCamFile(event)">
        </label>
        <label class="btn-ghost" style="display:block;text-align:center;padding:12px;cursor:pointer">
          🖼 Välj från galleri
          <input type="file" accept="image/*" style="display:none" onchange="handleCamFile(event)">
        </label>
      </div>`;
  }else if(camState.phase==="preview"){
    el.innerHTML=`<div style="width:100%;display:flex;align-items:center;justify-content:center">
      <img src="data:${camState.mime};base64,${camState.imgB64}" alt="" style="max-width:100%;max-height:calc(100dvh - 160px);border-radius:8px;border:1px solid var(--border)">
    </div>`;
    const ctrl=document.createElement("div");ctrl.className="cam-controls";
    ctrl.innerHTML=`<button class="btn-ghost" style="flex:1" onclick="camState.phase='pick';renderCam()">← Nytt foto</button>
      <button class="btn btn-amber" style="flex:2;padding:12px" onclick="doCamAnalyze()">🔍 Analysera med AI</button>`;
    document.getElementById("cam-overlay").appendChild(ctrl);
  }else if(camState.phase==="analyzing"){
    el.innerHTML=`<div style="text-align:center">
      <div class="spin-ring"><div class="spin-icon">🍾</div></div>
      <div style="font-size:15px;font-weight:700;margin-bottom:5px">AI läser etiketten…</div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:.25em;text-transform:uppercase">Identifierar produkt</div>
    </div>`;
  }else if(camState.phase==="result"&&camState.result){
    const r=camState.result;const p=r.prod;
    const cc=r.confidence>=80?"var(--green)":r.confidence>=60?"var(--amber)":"var(--red)";
    el.innerHTML=`<div style="width:100%;max-width:360px">
      <div style="background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:14px;margin-bottom:10px">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <img src="data:${camState.mime};base64,${camState.imgB64}" alt="" style="width:64px;height:80px;object-fit:cover;border-radius:6px;flex-shrink:0;border:1px solid var(--border)">
          <div style="flex:1;min-width:0">
            <div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2px">${esc(p.cat)}</div>
            <div style="font-size:16px;font-weight:700;line-height:1.2;margin-bottom:3px">${esc(p.name)}</div>
            <div style="font-size:11px;color:var(--muted)">${p.mode==="spirit"?`${p.size_cl}cl · ${p.price||0} kr/fl`:`${p.price||0} kr/st`}</div>
            ${r.reasoning?`<div style="font-size:10px;color:var(--muted);margin-top:4px;font-style:italic">"${esc(r.reasoning)}"</div>`:""}
          </div>
          <div style="text-align:center;flex-shrink:0">
            <div style="font-size:20px;font-weight:700;color:${cc}">${r.confidence}%</div>
            <div style="font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)">match</div>
          </div>
        </div>
        ${p.mode==="spirit"?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:10px;color:var(--muted)">AI-uppskattat kvar</div>
          <div style="font-size:18px;font-weight:700;color:var(--amber)">${Math.round((r.fillPct/100)*p.size_cl)} cl <span style="font-size:11px">av ${p.size_cl} cl</span></div>
        </div>`:""}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-ghost" style="flex:1" onclick="camState.phase='pick';renderCam()">← Nytt foto</button>
        <button class="btn btn-green" style="flex:2;padding:12px" onclick="useCamResult()">✓ Lägg till</button>
      </div>
    </div>`;
  }else if(camState.phase==="error"){
    el.innerHTML=`<div style="text-align:center;max-width:280px">
      <div style="font-size:44px;margin-bottom:10px">⚠️</div>
      <div style="font-size:13px;color:var(--red);font-weight:600;line-height:1.5;margin-bottom:18px">${esc(camState.error)}</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn-ghost btn-sm" onclick="camState.phase='pick';renderCam()">← Försök igen</button>
        <button class="btn btn-amber btn-sm" onclick="closeCamera()">Stäng</button>
      </div>
    </div>`;
  }
}
function handleCamFile(e){
  const f=e.target.files?.[0];if(!f)return;
  const mime=f.type?.startsWith("image/")?f.type:"image/jpeg";
  const reader=new FileReader();
  reader.onload=ev=>{camState.imgB64=ev.target.result.split(",")[1];camState.mime=mime;camState.phase="preview";renderCam();};
  reader.readAsDataURL(f);e.target.value="";
}
async function doCamAnalyze(){
  if(!apiKey){closeCamera();openModal("modal-api");return;}
  camState.phase="analyzing";renderCam();
  try{
    const r=await aiImage(camState.imgB64,camState.mime);
    if(!r.matched_name)throw new Error("Ingen matchning — prova ett tydligare foto.");
    const p=products.find(x=>x.name===r.matched_name);
    if(!p)throw new Error("Produkten saknas i listan.");
    let fp=r.fill_percent??85;
    if(p.mode==="spirit"&&p.size_cl>0&&typeof r.remaining_cl==="number")fp=Math.max(0,Math.min(100,Math.round(r.remaining_cl/p.size_cl*100)));
    camState.result={prod:p,confidence:r.confidence,fillPct:fp,reasoning:r.reasoning||""};
    camState.phase="result";
  }catch(err){camState.error=err.message||"Okänt AI-fel.";camState.phase="error";}
  renderCam();
}
function useCamResult(){
  const r=camState.result;if(!r)return;
  const pb=camState.pendingBar;closeCamera();
  if(pb&&pb!==currentView)navTo(pb);
  const p=r.prod;
  window._cp={prod:p,size:p.size_cl,fillPct:r.fillPct,hela:0,cl:p.mode==="spirit"?Math.round((r.fillPct/100)*p.size_cl):0,qty:1};
  document.getElementById("scan-inp").value=p.name;
  showResultCard(p,r.confidence,r.fillPct);
}

/* ═══ EXPORT ═══ */
function exportCSV(){
  const rows=[["Produkt","Kategori","Typ","Storlek/Enhet","Kr/enhet",...bars.map(b=>b.name),"TOT.FL","TOT.CL","TOT.KR"]];
  products.forEach(p=>{
    const hasAny=bars.some(b=>{const e=(inventory[b.id]||{})[p.id];return e&&(e.hela||0)+(e.cl||0)+(e.antal||0)>0;});
    if(!hasAny)return;
    const bv=bars.map(b=>{const e=(inventory[b.id]||{})[p.id];if(!e)return"";
      return p.mode==="spirit"?(((e.hela||0)*p.size_cl+(e.cl||0))/p.size_cl).toFixed(2):e.antal||"";});
    let tfl="",tcl="",tkr="";
    if(p.mode==="spirit"){let c=0;bars.forEach(b=>{const e=(inventory[b.id]||{})[p.id];if(e)c+=(e.hela||0)*p.size_cl+(e.cl||0);});
      tfl=(c/p.size_cl).toFixed(2);tcl=c.toFixed(1);tkr=Math.round((c/p.size_cl)*(p.price||0));}
    else{let n=0;bars.forEach(b=>{const e=(inventory[b.id]||{})[p.id];if(e)n+=e.antal||0;});tkr=n*(p.price||0);}
    rows.push([p.name,p.cat,p.mode==="spirit"?"Sprit":"Enhet",p.mode==="spirit"?p.size_cl:p.unit||"st",p.price||0,...bv,tfl,tcl,tkr]);
  });
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(",")).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=Object.assign(document.createElement("a"),{href:url,download:`stocksense-${new Date().toISOString().slice(0,10)}.csv`});
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
async function clearAll(){
  if(!confirm("Rensa ALLT lager i databasen?"))return;
  const barIds=bars.map(b=>b.id);
  await sb().from("inventory").delete().in("bar_id",barIds);
  inventory={};flash("Lager rensat","var(--red)");renderSidebar();
}
